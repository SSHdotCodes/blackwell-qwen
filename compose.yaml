services:
  qwen:
    build: .
    ipc: host
    ports:
      - "8000:8000"
    environment:
      PROFILE: ${PROFILE:-throughput}
      MODEL_PATH: /model
      DRAFT_MODEL_PATH: /draft
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MODEL_DIR:-./model}:/model:ro
      - ${DRAFT_MODEL_DIR:-./draft}:/draft:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
